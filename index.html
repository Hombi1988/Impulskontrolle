<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Impulskontrolle</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Impulskontrolle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --accent:#2E7D6B; --accent-d:#215C4F; --accent-l:#E6F1EE;
  --gold:#E8A33D; --gold-l:#FDF2E1;
  --red:#C9573F; --red-l:#FBE9E4;
  --ink:#1E2A28; --muted:#6B7774; --line:#E4E9E7; --soft:#F4F7F6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

.top{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 16px 8px}
.top img{width:46px;height:46px;border-radius:13px}
.top h1{font-size:22px;margin:0;letter-spacing:-.3px;line-height:1.1}
.top small{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:2px}
main{max-width:560px;margin:0 auto;padding:6px 16px 24px}

.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs-in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:11px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--accent);font-weight:600}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

h2{font-size:17px;margin:24px 0 10px}
p{line-height:1.45}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.soft{background:var(--soft);border-color:transparent}

.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px;font-size:17px;font-weight:650;
  background:var(--accent);color:#fff;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--red-l);color:var(--red)}
.btn.inline{display:inline-block;width:auto;padding:11px 16px;font-size:15px;border-radius:12px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 4px;font-size:15px}

.lvl{display:flex;align-items:center;gap:14px}
.badge{width:58px;height:58px;border-radius:50%;background:var(--gold);color:#fff;flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.badge b{font-size:22px;font-weight:800}
.badge span{font-size:9px;font-weight:700;letter-spacing:.6px;margin-top:2px;text-transform:uppercase;opacity:.9}
.lvl-name{font-weight:700;font-size:17px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .7s ease}
.bar.green>i{background:var(--accent)}

.row{display:flex;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{flex:1;background:var(--soft);border-radius:16px;padding:12px 10px;text-align:center}
.kpi b{display:block;font-size:24px;letter-spacing:-.5px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi em{display:block;font-style:normal;font-size:11px;margin-top:3px;color:var(--muted)}
.kpi em.up{color:var(--accent)} .kpi em.down{color:var(--red)}

.banner{background:var(--gold-l);border-radius:16px;padding:13px 15px;margin-bottom:14px;font-size:15px;line-height:1.4}
.focus-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.focus-item:last-child{border-bottom:0}

.chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 9px;border-radius:20px;background:var(--soft);color:var(--muted);margin:0 6px 6px 0}
.st-neu{background:#EEF0F6;color:#5B6382}
.st-ueben{background:var(--red-l);color:var(--red)}
.st-aufbau{background:var(--gold-l);color:#A86C10}
.st-gut{background:var(--accent-l);color:var(--accent-d)}
.st-super{background:var(--accent);color:#fff}

.seg{display:flex;background:var(--soft);border-radius:13px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.period{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.period b{font-size:16px}
.period button{background:var(--soft);border:0;width:38px;height:38px;border-radius:12px;font-size:20px;color:var(--ink)}
.period button:disabled{opacity:.3}
.chart{width:100%;height:auto;display:block}
.goal{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.stack-bar{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:10px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

details.ex{border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.ex summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:10px}
details.ex summary::-webkit-details-marker{display:none}
details.ex summary .t{flex:1;font-weight:600}
details.ex summary .t small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
details.ex[open] summary{border-bottom:1px solid var(--line)}
details.ex .body{padding:14px 16px}
details.ex.off summary .t{opacity:.45}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;margin-top:12px;border-top:1px solid var(--line);font-size:15px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:30px;transition:.2s}
.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{transform:translateX(20px)}

.ex-content h3{font-size:21px;margin:0 0 8px;letter-spacing:-.3px}
.ex-content h4{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:16px 0 6px}
.ex-content p{margin:0}
.ex-content ol{margin:0 0 12px;padding-left:22px}
.ex-content li{margin-bottom:7px;line-height:1.42}
.tipp{background:var(--gold-l);border-radius:12px;padding:11px 13px;margin-top:16px;font-size:14px;line-height:1.4}

.field{margin-bottom:16px}
.field label{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.field .hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
.input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;background:#fff}
.input:focus{outline:2px solid var(--accent);border-color:transparent}

/* Training */
.train{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 14px);
  max-width:560px;margin:0 auto}
.train-head{display:flex;justify-content:space-between;align-items:center}
.train-head .prog{font-size:14px;color:var(--muted);font-weight:600}
.train-head .prog b{color:var(--gold)}
.stack{flex:1;position:relative;margin:8px 0 12px;min-height:0}
.excard{position:absolute;inset:0;overflow-y:auto;border:1px solid var(--line);border-radius:22px;
  padding:0 0 24px;background:#fff;touch-action:pan-y;box-shadow:0 8px 28px rgba(30,42,40,.09);
  will-change:transform;z-index:1;user-select:none;-webkit-user-select:none}
.excard .ex-content{padding:16px 20px 0}
.ex-img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--soft);pointer-events:none}
.excard .ex-img{border-radius:21px 21px 0 0}
details.ex .ex-img{border-radius:12px;margin-bottom:4px}
.card-behind{position:absolute;inset:10px 10px -8px;border:1px solid var(--line);border-radius:22px;background:#fff;
  transform:scale(.96) translateY(6px);box-shadow:0 4px 14px rgba(30,42,40,.05)}
.chip.freq{background:var(--accent-l);color:var(--accent-d)}
.ex-content p{margin:0 0 10px}
.ex-content ul{margin:0 0 12px;padding-left:20px}
.excard.enter{animation:enter .28s ease}
@keyframes enter{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.swipe-tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);background:var(--ink);color:#fff;
  font-size:18px;font-weight:800;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;z-index:2;
  box-shadow:0 6px 20px rgba(0,0,0,.2)}
.swipe-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:-4px;margin-bottom:8px}
.rq{font-weight:700;font-size:15px;margin-bottom:8px;text-align:center}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate button{border:0;border-radius:16px;padding:10px 3px 9px;font-size:14px;font-weight:700;line-height:1.2;
  display:flex;flex-direction:column;align-items:center;gap:5px;min-height:78px;transition:transform .1s}
.rate button:active{transform:scale(.94)}
.rate .e{font-size:30px;line-height:1}
.r1{background:var(--red-l);color:var(--red)}
.r2{background:var(--gold-l);color:#A86C10}
.r3{background:var(--accent-l);color:var(--accent-d)}
.r4{background:var(--accent);color:#fff}
.skip{display:block;width:100%;margin-top:10px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:16px;padding:13px;font-size:15px;font-weight:650;transition:transform .1s}
.skip:active{transform:scale(.98)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,30,28,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;
  padding:26px 20px calc(22px + env(safe-area-inset-bottom));text-align:center;animation:up .3s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h3{font-size:22px;margin:6px 0 4px}
.big-xp{font-size:40px;font-weight:800;color:var(--gold);letter-spacing:-1px;margin:10px 0 2px}
.xp-lines{font-size:14px;color:var(--muted);margin:8px 0 16px;line-height:1.6}
.emos{font-size:26px;letter-spacing:4px;margin:6px 0}
.levelup{background:var(--gold-l);border-radius:16px;padding:14px;margin:14px 0}
.levelup .badge{margin:0 auto 8px;width:70px;height:70px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.levelup .badge b{font-size:28px}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}

.modal{max-height:92vh;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:50;
  max-width:calc(100% - 32px);text-align:center;animation:fade .2s}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.tabs button{font-size:10.5px}
.code-in{text-transform:uppercase;letter-spacing:2px;font-weight:600}
.kurs-h{margin-top:18px!important}
.who{font-size:14px;line-height:1.5;margin-bottom:6px}
.who .chip{margin:0 4px 0 0}
.rank{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .pos{width:28px;text-align:center;font-size:18px;color:var(--muted);font-weight:700}
.rank .nm{flex:1;font-weight:600;min-width:0}
.rank .nm small{color:var(--muted);font-weight:500}
.rank .val{font-weight:700;color:var(--gold);white-space:nowrap}
.rank .val small{color:var(--muted);font-weight:500}
.rank.me{background:var(--accent-l);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:10px}
.mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mx{border-collapse:separate;border-spacing:0;font-size:13px}
.mx th,.mx td{padding:3px}
.mx thead th{vertical-align:bottom;height:130px}
.mx thead th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;max-height:126px;overflow:hidden;text-overflow:ellipsis}
.mx .sticky{position:sticky;left:0;background:#fff;text-align:left;font-weight:600;padding-right:10px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;z-index:1}
.mx tr.me .sticky{color:var(--accent-d)}
.d{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:middle}
.legend .d{width:10px;height:10px;border-radius:3px;margin-right:5px}
.k0{background:#E4E7EF}.k1{background:var(--red)}.k2{background:var(--gold)}.k3{background:#6FB3A2}.k4{background:var(--accent)}
.adm-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.adm-row img,.adm-row .noimg{width:52px;height:34px;object-fit:cover;border-radius:6px;flex:none;background:var(--soft);display:flex;align-items:center;justify-content:center}
.adm-row .t{flex:1;min-width:0;font-weight:600;font-size:14px}
.adm-row .t small{display:block;color:var(--muted);font-weight:500}
.adm-row.off .t{opacity:.5}
.adm-row .acts{display:flex;gap:4px}
.adm-row .acts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:13px;font-weight:600}
.adm-row .acts button:disabled{opacity:.3}
.code{font-size:24px;font-weight:800;letter-spacing:3px}
.qr{width:96px;flex:none}.qr svg{width:100%;height:auto;display:block}
.exform{text-align:left}
.exform h3{text-align:center}
.exform textarea.input{resize:vertical;font-family:inherit;line-height:1.4}
.check{display:flex;align-items:center;gap:8px;font-size:15px;margin-top:8px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.fimg{border:1.5px dashed var(--line);border-radius:12px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:var(--muted);overflow:hidden;background:var(--soft)}
.fimg img{width:100%;height:100%;object-fit:cover}
details.more{margin-bottom:16px}
details.more summary{font-weight:600;font-size:15px;cursor:pointer}
.modal{padding-top:22px}
</style>
</head>
<body>

<header class="top">
  <img src="icon-128.png" alt="">
  <div><h1>Impulskontrolle</h1><small>by René Homberger</small></div>
</header>

<main id="view"></main>

<nav class="tabs"><div class="tabs-in">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Start</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Statistik</button>
  <button data-tab="course"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c2.4-.3 4.4 1.2 5 4.3"/></svg>Kurs</button>
  <button data-tab="list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Übungen</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
</div></nav>

<div id="overlay"></div>
<div id="modal"></div>

<script src="firebase-config.js"></script>
<script src="cloud.bundle.js"></script>
<script>
'use strict';
const KEY = 'impulskontrolle.v1';
const DAY = 864e5;
let EX = [];      // sichtbare Übungen
let EX_ALL = [];  // inkl. ausgeblendete (Verwaltung)
const exById = id => EX.find(e => e.id === id);
const $ = s => document.querySelector(s);

const RATINGS = [null,
  { t: 'Nein', e: '😣', c: 'r1' },
  { t: 'Naja', e: '😐', c: 'r2' },
  { t: 'Super', e: '🤩', c: 'r3' }];
const LEVELS = ['Welpe', 'Schnüffelnase', 'Lehrling', 'Geduldsprobe', 'Wartekünstler',
  'Ruhepol', 'Selbstbeherrscher', 'Fels in der Brandung', 'Zen-Hund', 'Impuls-Meister'];

// ---------- Daten ----------
function defaults() {
  return { dog: '', settings: { onboarded: false, weekGoal: 4, monthGoal: 15 },
           log: [], sessions: [], ex: {}, xp: 0, ups: [],
           cloud: { courseId: null, courseName: '', code: '', season: 1, seasonBase: 0, uid: '' } };
}
let S;
try {
  const raw = JSON.parse(localStorage.getItem(KEY));
  S = Object.assign(defaults(), raw || {});
  S.settings = Object.assign(defaults().settings, S.settings || {});
  S.cloud = Object.assign(defaults().cloud, S.cloud || {});
} catch (e) { S = defaults(); }

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

// ---------- Helfer ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dogName = () => S.dog.trim();
const Dog = () => dogName() || 'Dein Hund';
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const midnight = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const daysSince = ts => Math.round((midnight(Date.now()) - midnight(ts)) / DAY);
const relDay = ts => { const n = daysSince(ts); return n === 0 ? 'heute' : n === 1 ? 'gestern' : `vor ${n} Tagen`; };
const lastTraining = () => S.log.length ? S.log[S.log.length - 1].t : 0;
const fmt1 = n => n.toFixed(1).replace('.', ',');

function streak() {
  const days = new Set(S.log.map(l => dayKey(l.t)));
  const d = new Date(); d.setHours(12, 0, 0, 0);
  if (!days.has(dayKey(d))) { d.setDate(d.getDate() - 1); if (!days.has(dayKey(d))) return 0; }
  let n = 0;
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

// ---------- Level ----------
const xpFor = l => 50 * l * (l - 1); // XP, ab denen Level l beginnt
function levelInfo(xp = S.xp) {
  let l = 1;
  while (xp >= xpFor(l + 1)) l++;
  const a = xpFor(l), b = xpFor(l + 1);
  return { l, name: LEVELS[Math.min(l, LEVELS.length) - 1], into: xp - a, need: b - a, pct: (xp - a) / (b - a) * 100 };
}

// ---------- Übungs-Stand & Gewichtung ----------
function exState(id) { return S.ex[id] || (S.ex[id] = { r: [], n: 0, last: 0, off: false }); }
function avgLast3(arr) { if (!arr.length) return 0; const s = arr.slice(-3); return s.reduce((a, b) => a + b, 0) / s.length; }
const mastery = id => avgLast3((S.ex[id] && S.ex[id].r) || []);
const masteryAt = (id, ts) => avgLast3(S.log.filter(l => l.id === id && l.t < ts).map(l => l.r));

function statusOf(m) {
  if (!m) return { t: 'Neu', c: 'neu', k: 0 };
  if (m >= 2.75) return { t: 'Sitzt', c: 'super', k: 4 };
  if (m >= 2.25) return { t: 'Gut dabei', c: 'gut', k: 3 };
  if (m >= 1.5) return { t: 'Im Aufbau', c: 'aufbau', k: 2 };
  return { t: 'Braucht Training', c: 'ueben', k: 1 };
}
const status = id => statusOf(mastery(id));

// Je schlechter die Bewertung, desto öfter kommt die Übung.
// Gut sitzende Übungen kommen seltener, tauchen aber mit der Zeit wieder auf.
function weight(id) {
  const st = S.ex[id], m = mastery(id);
  let w = m === 0 ? 3.5 : 7 - 2.1 * m;            // Neu 3.5 · Nein 4.9 · Naja 2.8 · Super 0.7
  if (st && st.last) w += Math.min(daysSince(st.last) * 0.15, 1.5);
  return Math.max(w, 0.3);
}
function pick(excl) {
  const pool = EX.filter(e => !(S.ex[e.id] && S.ex[e.id].off) && !excl.has(e.id));
  if (!pool.length) return null;
  const ws = pool.map(e => weight(e.id));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}
const activeCount = () => EX.filter(e => !(S.ex[e.id] && S.ex[e.id].off)).length;

// ---------- Ansicht: Übung ----------
function exHTML(e, withImg) {
  const st = status(e.id);
  const list = (arr, num) => `<${num ? 'ol' : 'ul'}>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</${num ? 'ol' : 'ul'}>`;
  return `${withImg && e.bild ? `<img class="ex-img" src="${esc(e.bild)}" alt="" draggable="false">` : ''}
  <div class="ex-content">
    <h3>${esc(e.titel)}</h3>
    <div>${e.haeufigkeit ? `<span class="chip freq">${esc(e.haeufigkeit)}</span>` : ''}<span class="chip st-${st.c}">${st.t}</span></div>
    ${(e.intro || []).map(p => `<p>${esc(p)}</p>`).join('')}
    ${(e.schritte || []).length ? list(e.schritte, e.nummeriert) : ''}
    ${(e.zusatz || []).length ? `${e.zusatzTitel ? `<p>${esc(e.zusatzTitel)}</p>` : ''}${list(e.zusatz, false)}` : ''}
    ${e.schluss ? `<div class="tipp">${esc(e.schluss)}</div>` : ''}

}

// ---------- Training ----------
let T = null;
function startTraining() {
  if (!EX.length) return toast('Noch keine Übungen hinterlegt.');
  if (!activeCount()) return toast('Alle Übungen sind ausgeschaltet.');
  T = { start: Date.now(), done: [], skipped: [], xp: 0, cur: null, lvl0: levelInfo().l };
  nextEx();
}
function nextEx() {
  T.cur = pick(new Set([...T.done.map(d => d.id), ...T.skipped]));
  renderTraining();
}
function renderTraining() {
  const o = $('#overlay');
  if (!T) { o.innerHTML = ''; document.body.style.overflow = ''; return; }
  document.body.style.overflow = 'hidden';
  if (!T.cur) {
    o.innerHTML = `<div class="train"><div class="stack" style="display:flex;align-items:center;justify-content:center">
      <div class="center"><div style="font-size:54px">🐾</div>
      <h3 style="margin:10px 0 6px">${T.done.length ? 'Alle Übungen für heute durch' : 'Keine weitere Übung möglich'}</h3>
      <p class="muted">${T.skipped.length ? `${T.skipped.length} übersprungen.` : ''}</p></div></div>
      <button class="btn" data-act="end">Training abschliessen</button></div>`;
    return;
  }
  const first = T.done.length === 0 && T.skipped.length === 0;
  o.innerHTML = `<div class="train">
    <div class="train-head">
      <button class="link" data-act="end">${T.done.length ? 'Fertig' : 'Abbrechen'}</button>
      <div class="prog">Übung ${T.done.length + 1}${T.xp ? ` · <b>+${T.xp} XP</b>` : ''}</div>
    </div>
    <div class="stack">${T.done.length + T.skipped.length + 1 < activeCount() ? '<div class="card-behind"></div>' : ''}<article class="excard enter" id="excard"><div class="swipe-tag">Überspringen</div>${exHTML(T.cur, true)}</article></div>
    ${first ? '<div class="swipe-hint">Geht gerade nicht? Karte zur Seite wischen.</div>' : ''}
    <div class="rq">Wie hat's geklappt?</div>
    <div class="rate">${[1, 2, 3].map(i => `<button class="${RATINGS[i].c}" data-rate="${i}"><span class="e">${RATINGS[i].e}</span>${RATINGS[i].t}</button>`).join('')}</div>
    <button class="skip" data-act="skip">↷ Geht gerade nicht – überspringen</button>
  </div>`;
  bindSwipe($('#excard'));
}
function flyOut(el, dx, dy, cb) {
  el.style.transition = 'transform .28s ease, opacity .28s ease';
  el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 20}deg)`;
  el.style.opacity = 0;
  setTimeout(cb, 240);
}
function doSkip() { if (!T || !T.cur) return; T.skipped.push(T.cur.id); nextEx(); }
function skipAnimated() { const el = $('#excard'); el ? flyOut(el, -window.innerWidth, 0, doSkip) : doSkip(); }

function rate(r) {
  if (!T || !T.cur) return;
  const e = T.cur, st = exState(e.id);
  const before = mastery(e.id), hadAny = st.r.length > 0, kBefore = status(e.id).k;
  st.r.push(r); if (st.r.length > 10) st.r = st.r.slice(-10);
  st.n++; st.last = Date.now();
  let xp = 10;
  if (hadAny && mastery(e.id) > before + 0.01) xp += 5;   // Fortschritt gibt Bonus
  S.log.push({ t: Date.now(), id: e.id, r, xp });
  if (status(e.id).k > Math.max(kBefore, 1)) S.ups.push({ t: Date.now(), id: e.id });  // Stufen-Aufstieg
  S.xp += xp;
  T.done.push({ id: e.id, r, xp }); T.xp += xp;
  save();
  const el = $('#excard');
  el ? flyOut(el, 0, -60, nextEx) : nextEx();
}

function bindSwipe(el) {
  if (!el) return;
  const tag = el.querySelector('.swipe-tag');
  let x0 = null, y0 = 0, dx = 0, drag = false;
  el.addEventListener('pointerdown', ev => { x0 = ev.clientX; y0 = ev.clientY; dx = 0; drag = false; });
  el.addEventListener('pointermove', ev => {
    if (x0 === null) return;
    dx = ev.clientX - x0;
    const dy = ev.clientY - y0;
    if (!drag) {
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.2) {
        drag = true; el.classList.remove('enter'); el.style.transition = 'none';
        try { el.setPointerCapture(ev.pointerId); } catch (e) {}
      } else return;
    }
    el.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
    tag.style.opacity = Math.min(Math.abs(dx) / 100, 1);
  });
  const up = () => {
    if (x0 === null) return;
    x0 = null;
    if (drag && Math.abs(dx) > 90) flyOut(el, Math.sign(dx) * window.innerWidth, 0, doSkip);
    else if (drag) { el.style.transition = 'transform .25s'; el.style.transform = ''; tag.style.opacity = 0; }
    drag = false;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

function endTraining() {
  if (!T) return;
  const t = T; T = null; renderTraining();
  if (!t.done.length) { render(); return; }
  const parts = [[`${t.done.length} Übung${t.done.length > 1 ? 'en' : ''}`, t.xp]];
  let bonus = 0;
  if (t.done.length >= 3) { bonus += 20; parts.push(['Runde mit 3+ Übungen', 20]); }
  const firstToday = !S.sessions.some(s => dayKey(s.end) === dayKey(Date.now()));
  const stk = streak();
  if (firstToday && stk > 1) { const b = Math.min(stk, 6) * 5; bonus += b; parts.push([`${stk} Tage am Stück`, b]); }
  S.xp += bonus;
  S.sessions.push({ start: t.start, end: Date.now(), n: t.done.length, xp: t.xp, bonus });
  save();
  syncMember();
  const lv = levelInfo();
  const up = lv.l > t.lvl0;
  const praise = ['Stark gemacht!', 'Gute Runde!', 'Weiter so!', 'Sauber trainiert!'][Math.floor(Math.random() * 4)];
  showModal(`
    <div style="font-size:44px">🐾</div>
    <h3>${praise}</h3>
    <div class="emos">${t.done.map(d => RATINGS[d.r].e).join('')}</div>
    <div class="big-xp">+${t.xp + bonus} XP</div>
    <div class="xp-lines">${parts.map(p => `${p[0]}: +${p[1]}`).join('<br>')}</div>
    ${up ? `<div class="levelup"><div class="badge"><b>${lv.l}</b><span>Level</span></div>
      <b>Level up!</b><br>${esc(Dog())} ist jetzt «${lv.name}».</div>` : `
      <div style="text-align:left;margin-bottom:16px"><div class="goal"><span>Level ${lv.l} · ${lv.name}</span><span class="muted">${lv.into}/${lv.need}</span></div>
      <div class="bar"><i style="width:${lv.pct}%"></i></div></div>`}
    <button class="btn" data-act="close">Weiter</button>`);
  tab = 'home'; render();
}

// ---------- Modal & Toast ----------
function showModal(html) { $('#modal').innerHTML = `<div class="modal-bg" data-act="close-bg"><div class="modal">${html}</div></div>`; }
function closeModal() { $('#modal').innerHTML = ''; }
let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d);

// ---------- Statistik ----------
function periodRange(kind, off) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (kind === 'week') {
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + 7 * off);
    const b = new Date(d); b.setDate(b.getDate() + 7);
    return [d.getTime(), b.getTime()];
  }
  return [new Date(d.getFullYear(), d.getMonth() + off, 1).getTime(), new Date(d.getFullYear(), d.getMonth() + off + 1, 1).getTime()];
}
function periodStats(kind, off) {
  const [a, b] = periodRange(kind, off);
  const L = S.log.filter(l => l.t >= a && l.t < b);
  const ses = S.sessions.filter(s => s.end >= a && s.end < b);
  return {
    a, b, L, n: L.length,
    days: new Set(L.map(l => dayKey(l.t))).size,
    avg: L.length ? L.reduce((s, l) => s + l.r, 0) / L.length : 0,
    xp: L.reduce((s, l) => s + l.xp, 0) + ses.reduce((s, x) => s + (x.bonus || 0), 0)
  };
}
function periodTitle(kind, a) {
  const d = new Date(a);
  if (kind === 'month') return d.toLocaleDateString('de-CH', { month: 'long', year: 'numeric' });
  const e = new Date(a); e.setDate(e.getDate() + 6);
  const f = x => `${x.getDate()}.${x.getMonth() + 1}.`;
  return `Woche ${f(d)} – ${f(e)}`;
}
function delta(cur, prev, label, dec) {
  const diff = cur - prev;
  if (!prev && !cur) return `<em>&nbsp;</em>`;
  if (Math.abs(diff) < 0.05) return `<em>gleich wie ${label}</em>`;
  const v = dec ? fmt1(Math.abs(diff)) : Math.abs(Math.round(diff));
  return `<em class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${v} vs. ${label}</em>`;
}
function chart(st, kind) {
  const n = Math.round((st.b - st.a) / DAY);
  const days = [];
  for (let i = 0; i < n; i++) {
    const k = dayKey(st.a + i * DAY + DAY / 2);
    const L = st.L.filter(l => dayKey(l.t) === k);
    days.push({ k, n: L.length, avg: L.length ? L.reduce((s, l) => s + l.r, 0) / L.length : 0 });
  }
  const max = Math.max(4, ...days.map(d => d.n));
  const W = 320, H = 136, top = 16, bottom = 22, slot = W / n, bw = Math.min(slot * 0.62, 26);
  const today = dayKey(Date.now());
  const WD = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Übungen pro Tag">`;
  s += `<line x1="0" x2="${W}" y1="${H - bottom}" y2="${H - bottom}" stroke="var(--line)"/>`;
  days.forEach((d, i) => {
    const x = i * slot + (slot - bw) / 2;
    const h = d.n ? Math.max(4, (H - top - bottom) * d.n / max) : 0;
    const col = d.avg >= 2.5 ? 'var(--accent)' : d.avg >= 1.75 ? '#6FB3A2' : 'var(--gold)';
    if (h) s += `<rect x="${x}" y="${H - bottom - h}" width="${bw}" height="${h}" rx="${Math.min(5, bw / 3)}" fill="${col}"/>`;
    if (kind === 'week' && d.n) s += `<text x="${x + bw / 2}" y="${H - bottom - h - 4}" font-size="10" text-anchor="middle" fill="var(--muted)">${d.n}</text>`;
    const lbl = kind === 'week' ? WD[i] : ((i + 1) % 5 === 0 || i === 0 ? String(i + 1) : '');
    if (lbl) s += `<text x="${i * slot + slot / 2}" y="${H - 6}" font-size="10" text-anchor="middle" fill="${d.k === today ? 'var(--ink)' : 'var(--muted)'}" font-weight="${d.k === today ? 700 : 400}">${lbl}</text>`;
  });
  return s + '</svg>';
}

function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `impulskontrolle-sicherung-${dayKey(Date.now())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.log) || typeof d.ex !== 'object') throw new Error();
      if (!confirm('Sicherung laden? Die aktuellen Daten werden ersetzt.')) return;
      S = Object.assign(defaults(), d); S.settings = Object.assign(defaults().settings, d.settings || {});
      save(); render(); toast('Sicherung geladen');
    } catch (e) { toast('Das ist keine gültige Sicherungsdatei.'); }
  };
  r.readAsText(file);
}

document.addEventListener('click', ev => {
  const t = ev.target;
  const tb = t.closest('[data-tab]');
  if (tb) { tab = tb.dataset.tab; if (tab === 'stats') statOff = 0; render(); window.scrollTo(0, 0); return; }
  const rb = t.closest('[data-rate]');
  if (rb) { rate(Number(rb.dataset.rate)); return; }
  const rk = t.closest('[data-rank]');
  if (rk) { rankKind = rk.dataset.rank; render(); return; }
  const sb = t.closest('[data-stat]');
  if (sb) { statKind = sb.dataset.stat; statOff = 0; render(); return; }
  const rx = t.closest('[data-reset-ex]');
  if (rx) {
    const id = rx.dataset.resetEx;
    if (confirm('Bewertungen dieser Übung zurücksetzen? Die Statistik bleibt erhalten.')) {
      const st = exState(id); st.r = []; st.n = 0; st.last = 0; save(); render();
    }
    return;
  }
  const ab = t.closest('[data-act]');
  if (!ab) return;
  if (ab.disabled) return;
  if (['ex-import','join','leave','refresh','admin','admin-back','redeem','drop-role','tcode-new','tcode-save','tcode-toggle','ex-new','ex-edit','ex-save','ex-del','ex-move','img-pick','img-remove','course-new','course-members','member-remove','ranking-reset'].includes(ab.dataset.act)) { handleCloudAct(ab.dataset.act, ab, ev); return; }
  switch (ab.dataset.act) {
    case 'start': startTraining(); break;
    case 'skip': skipAnimated(); break;
    case 'end': endTraining(); break;
    case 'close': closeModal(); break;
    case 'close-bg': if (t === ab && !$('#onbGo') && !$('.exform')) closeModal(); break;
    case 'onbgo': finishOnboarding(); break;
    case 'prev': statOff--; render(); break;
    case 'next': if (statOff < 0) { statOff++; render(); } break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset':
      if (confirm('Wirklich alles löschen? Level, Statistik und Bewertungen gehen verloren.')) {
        const keepDog = S.dog, keepCloud = S.cloud; S = defaults(); S.dog = keepDog; S.cloud = keepCloud; save(); syncMember(); render(); toast('Zurückgesetzt');

const EXKEY = 'impulskontrolle.ex';
const IMG = {};
const IDB = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('impulskontrolle', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('img');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('img', mode), rq = fn(t.objectStore('img'));
    t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error);
  }));
  return { get: k => run('readonly', s => s.get(k)), put: (k, v) => run('readwrite', s => s.put(v, k)), del: k => run('readwrite', s => s.delete(k)) };
})();
const lines = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
const paras = s => String(s || '').split(/\n\s*\n/).map(x => x.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
function toApp(x) {
  return { id: x.id, titel: x.title || 'Ohne Titel', haeufigkeit: x.freq || '', intro: paras(x.intro), schritte: lines(x.steps),
    nummeriert: !!x.numbered, zusatzTitel: x.extraTitle || '', zusatz: lines(x.extra), schluss: x.note || '',
    bild: x.imgV ? (IMG[x.id] || '') : (x.imgUrl || ''), hidden: !!x.hidden, order: x.order || 0, raw: x };
}
let exCache = { v: 0, list: [], imgV: {} };
try { exCache = Object.assign(exCache, JSON.parse(localStorage.getItem(EXKEY)) || {}); } catch (e) {}
function applyExercises() {
  EX_ALL = exCache.list.map(toApp).sort((a, b) => a.order - b.order || a.titel.localeCompare(b.titel));
  EX = EX_ALL.filter(e => !e.hidden);
}
async function loadImagesFromIDB() {
  await Promise.all(exCache.list.filter(x => x.imgV).map(async x => {
    try { const r = await IDB.get(x.id); if (r && r.v === x.imgV) IMG[x.id] = r.data; } catch (e) {}
  }));
  applyExercises();
}
let exSyncing = null, exLoaded = false;
function syncExercises(force) {
  if (!Cloud.configured) { exLoaded = true; return Promise.resolve(); }
  if (exSyncing) return exSyncing;
  exSyncing = (async () => {
    try {
      const v = await Cloud.exercisesVersion();
      if (!force && v === exCache.v) return;
      const list = await Cloud.exercises();
      const imgV = {};
      for (const x of list) {
        if (!x.imgV) continue;
        if (exCache.imgV[x.id] === x.imgV && IMG[x.id]) { imgV[x.id] = x.imgV; continue; }
        const d = await Cloud.image(x.id);
        if (d) { IMG[x.id] = d; imgV[x.id] = x.imgV; try { await IDB.put(x.id, { v: x.imgV, data: d }); } catch (e) {} }
      }
      Object.keys(exCache.imgV).forEach(id => { if (!imgV[id]) { delete IMG[id]; IDB.del(id).catch(() => {}); } });
      exCache = { v, list, imgV };
      list.filter(x => x.imgUrl && !x.imgV).forEach(x => fetch(x.imgUrl, { mode: 'no-cors' }).catch(() => {}));
      try { localStorage.setItem(EXKEY, JSON.stringify(exCache)); } catch (e) {}
      applyExercises();
    } catch (e) { console.warn('Übungen laden', e); }
    finally { exSyncing = null; exLoaded = true; if (!T) render(); }
  })();
  return exSyncing;
}

const weekKey = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dayKey(d.getTime()); };
const weekUpsNow = () => { const wk = weekKey(Date.now()); return (S.ups || []).filter(u => weekKey(u.t) === wk).length; };
let course = null, members = null, membersAt = 0, rankKind = 'week';

async function syncMember() {
  if (!Cloud.configured || !S.cloud.courseId) return;
  try {
    const c = await Cloud.course(S.cloud.courseId);
    const uid = await Cloud.uid();
    if (!c) return leaveLocal('Der Kurs existiert nicht mehr.');
    if ((c.removed || []).includes(uid)) return leaveLocal('Du bist nicht mehr in diesem Kurs.');
    course = c; S.cloud.courseName = c.name; S.cloud.uid = uid;
    if ((c.season || 1) !== S.cloud.season) { S.cloud.season = c.season || 1; S.cloud.seasonBase = S.xp; }
    const status = {};
    EX_ALL.forEach(e => { const k = status_k(e.id); if (k) status[e.id] = k; });
    await Cloud.pushMember(c.id, {
      dog: (dogName() || 'Hund').slice(0, 30), status,
      seasonXp: Math.max(0, Math.round(S.xp - S.cloud.seasonBase)), season: S.cloud.season,
      week: weekKey(Date.now()), weekUps: weekUpsNow()
    });
    save(); members = null;
  } catch (e) { console.warn('Kurs abgleichen', e); }
}
const status_k = id => status(id).k;
async function loadMembers(force) {
  if (!Cloud.configured || !S.cloud.courseId) return;
  if (!force && members && Date.now() - membersAt < 120000) return;
  try { members = await Cloud.members(S.cloud.courseId); membersAt = Date.now(); }
  catch (e) { console.warn('Teilnehmer laden', e); if (!members) members = []; }
  if (!T && (tab === 'course' || tab === 'list')) render();
}
async function joinCourse(code) {
  code = String(code || '').trim().toUpperCase();
  if (!code) throw new Error('Bitte den Kurscode eingeben.');
  const c = await Cloud.findCourse(code);
  if (!c) throw new Error('Kein Kurs mit diesem Code gefunden.');
  const uid = await Cloud.uid();
  if ((c.removed || []).includes(uid)) throw new Error('Du kannst diesem Kurs nicht mehr beitreten.');
  S.cloud = { courseId: c.id, courseName: c.name, code: c.code, season: c.season || 1, seasonBase: S.xp, uid };
  course = c; save();
  await syncMember(); await loadMembers(true);
  toast(`Willkommen im Kurs «${c.name}»`);
}
function leaveLocal(msg) {
  S.cloud = defaults().cloud; course = null; members = null; save();
  if (msg) toast(msg);
  if (!T) render();
}
const medal = pos => ['🥇', '🥈', '🥉'][pos - 1] || `${pos}.`;
const shortTitle = t => String(t).replace(/^(Das|Der|Die)\s+/i, '').replace(/[«»"„“]/g, '').replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, '').trim();

function resizeImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const max = 1000, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let q = 0.78, d = c.toDataURL('image/jpeg', q);
      while (d.length > 300000 && q > 0.4) { q -= 0.08; d = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(img.src); res(d);
    };
    img.onerror = () => rej(new Error('Das Bild konnte nicht gelesen werden.'));
    img.src = URL.createObjectURL(file);
  });
}

async function importStart(btn) {
  const list = START_EXERCISES;
  const have = new Set(EX_ALL.map(e => e.titel.trim().toLowerCase()));
  const todo = list.filter(x => !have.has(String(x.title).trim().toLowerCase()));
  if (!todo.length) { toast('Alle Startübungen sind schon vorhanden.'); return; }
  if (!confirm(`${todo.length} Startübungen mit Fotos importieren?`)) return;
  const base = EX_ALL.reduce((m, e) => Math.max(m, e.order), 0);
  btn.disabled = true;
  try {
    for (let i = 0; i < todo.length; i++) {
      btn.textContent = `Importiere ${i + 1} von ${todo.length} …`;
      const { img, ...data } = todo[i];
      data.order = base + i + 1;
      data.imgUrl = START_IMG_BASE + img;
      await Cloud.saveExercise(null, data, undefined);
    }
    await syncExercises(true); toast(`${todo.length} Übungen importiert`);
  } catch (e) { toast(errMsg(e)); await syncExercises(true); }
  render();
}

      const name = ($('#tName').value || '').trim(), courses = [...document.querySelectorAll('.tCourse:checked')].map(x => x.value);
      if (!name) { toast('Bitte einen Namen eingeben.'); return true; }
      if (!courses.length) { toast('Bitte mindestens einen Kurs wählen.'); return true; }
      await busy(ab, async () => { const code = await Cloud.createTrainerCode(name, courses); closeModal(); await loadAdminData(); render(); toast('Trainer-Code ' + code + ' erstellt'); });
      return true;
    }
    case 'tcode-toggle': await busy(ab, async () => { await Cloud.setTrainerCode(id, { active: ab.dataset.active !== '1' }); await loadAdminData(); render(); }); return true;
    case 'ex-new': showExForm(null); return true;
    case 'ex-edit': showExForm(id); return true;
    case 'ex-save': await saveExForm(ab); return true;
    case 'ex-del':
      if (confirm('Diese Übung endgültig löschen?')) await busy(ab, async () => { await Cloud.deleteExercise(formId); closeModal(); await syncExercises(true); toast('Gelöscht'); render(); });
      return true;
    case 'ex-move': {
      const i = EX_ALL.findIndex(e => e.id === id), j = i + Number(ab.dataset.dir);
      if (j < 0 || j >= EX_ALL.length) return true;
      const list = [...EX_ALL]; [list[i], list[j]] = [list[j], list[i]];
      await busy(ab, async () => {
        await Cloud.updateExercises(list.map((e, k) => ({ id: e.id, data: { order: k + 1 } })).filter((c, k) => list[k].order !== k + 1));
        await syncExercises(true); render();
      });
      return true;
    }
    case 'ex-import': await importStart(ab); return true;
    case 'img-pick': $('#fImgFile').click(); return true;
    case 'img-remove': formImg = null; $('#fImgBox').innerHTML = '<span>Kein Foto</span>'; $('#fImgDel').style.display = 'none'; return true;
    case 'course-new': {
      const name = prompt('Name des Kurses', `Kurs ${(adm.courses || []).length + 1}`);
      if (name && name.trim()) await busy(ab, async () => { await Cloud.createCourse(name); await loadAdminData(); render(); });
      return true;
    }
    case 'course-members':
      if (adm.openCourse === id) { adm.openCourse = null; render(); return true; }
      await busy(ab, async () => { adm.courseMembers[id] = (await Cloud.members(id)).sort((a, b) => String(a.dog).localeCompare(String(b.dog))); adm.openCourse = id; render(); });
      return true;
    case 'member-remove':
      if (confirm('Diesen Teilnehmer aus dem Kurs entfernen? Er kann danach nicht mehr beitreten.')) {
        await busy(ab, async () => { await Cloud.removeMember(ab.dataset.course, id); adm.courseMembers[ab.dataset.course] = (adm.courseMembers[ab.dataset.course] || []).filter(m => m.id !== id); render(); });
      }
      return true;
    case 'ranking-reset':
      if (confirm('Gesamt-Rangliste neu starten? Alle beginnen wieder bei 0 XP. Das Training der Teilnehmer bleibt erhalten.')) {
        await busy(ab, async () => { await Cloud.resetRanking(id, Number(ab.dataset.season)); await loadAdminData(); toast('Rangliste neu gestartet'); render(); });
      }
      return true;
  }
  return false;
}
document.addEventListener('change', async ev => {
  if (ev.target.id !== 'fImgFile' || !ev.target.files[0]) return;
  try {
    const d = await resizeImage(ev.target.files[0]);
    formImg = d; $('#fImgBox').innerHTML = `<img src="${d}" alt="">`; $('#fImgDel').style.display = '';
    toast(`Foto verkleinert auf ${Math.round(d.length * 0.75 / 1024)} KB`);
  } catch (e) { toast(errMsg(e)); }
  ev.target.value = '';
});


// ---------- Start ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
applyExercises();
render();
loadImagesFromIDB().then(() => { if (!T) render(); });
syncExercises().then(() => { if (S.cloud.courseId) syncMember(); });
if (!S.settings.onboarded) showOnboarding();
else if (new URLSearchParams(location.search).get('kurs') && !S.cloud.courseId) { tab = 'course'; render(); }
</script>
</body>
